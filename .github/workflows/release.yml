name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    name: Build sdist + wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install build
        run: uv pip install --system build

      - name: Build distributions
        run: python -m build

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  smoke:
    name: Wheel install smoke test
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download dist artifact
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Install built wheel into a clean venv
        run: |
          python -m venv .smoke
          .smoke/bin/pip install --upgrade pip
          .smoke/bin/pip install dist/*.whl

      - name: Verify CLI entry point
        run: |
          .smoke/bin/seance --help
          .smoke/bin/seance --version || true

      - name: Verify summon end-to-end
        run: |
          .smoke/bin/seance summon tests/fixtures/tiny.csv --json > /tmp/out.json
          test -s /tmp/out.json
          python -c "import json; d=json.load(open('/tmp/out.json')); assert isinstance(d, dict) and 'schema_version' in d, d"

  publish:
    name: Publish to PyPI
    needs: [build, smoke]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    environment:
      name: pypi
      url: https://pypi.org/p/schema-seance
    permissions:
      id-token: write   # OIDC for trusted publishing
    steps:
      - name: Download dist artifact
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
