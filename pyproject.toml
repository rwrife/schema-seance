[project]
name = "schema-seance"
version = "0.1.0"
description = "A CLI medium for your messy data — summons schemas, PII, and anomalies from CSV/JSONL/Parquet/SQLite."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "rwrife" }]
keywords = ["cli", "data", "profiling", "duckdb", "pii", "schema"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Utilities",
]
dependencies = [
    "click>=8.1",
    "rich>=13.7",
    "duckdb>=1.0",
]

[project.optional-dependencies]
tui = [
    "textual>=0.60",
]

[project.scripts]
seance = "schema_seance.cli:main"

[project.urls]
Homepage = "https://github.com/rwrife/schema-seance"
Issues = "https://github.com/rwrife/schema-seance/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["schema_seance"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
    "textual>=0.60",
]
